services:
  - type: web
    name: nourish-mcp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NOURISH_API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
    healthCheckPath: /health